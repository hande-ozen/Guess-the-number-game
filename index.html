<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tahmin Oyunu</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@tsparticles/confetti@3.0.3/tsparticles.confetti.bundle.min.js"></script>
</head>

<body>
    <div class="container" id="baslaEkran">
        <h1>Tahmin Oyununa Hos Geldiniz</h1>
        <button id="oyunaBaslaBtn">Oyuna Basla</button>
        <img class="cat" src="img/Asset 1.png" alt="cat">
    </div>

    <div class="container gizle" id="oyunHazirEkran">
        <p>Simdi ben 1 ile 50 arasinda bir sayi tuttum.</p>
        <p>Hazirsaniz Baslayalim</p>
        <button id="oyunaHazirBtn">Hazirim</button>
    </div>

    <div class="container info gizle" id="infoEkran">
        <p>Sayiyi dogru bilemezseniz, bulabilmeniz icin size ipucu verecegim.</p>
        <p>Bol Sans...</p>
        <img class="cat cat-top" src="img/Asset 1.png" alt="cat">
    </div>

    <div class="container gizle" id="oyunEkran">
        <h2>Lütfen tahmininizi asagidaki alana yaziniz.</h2>
        <input type="number" id="tahminInp">
        <button id="tahminEtBtn">Tahmin Et</button>
        <img class="cat cat-left" src="img/Asset 1.png" alt="cat">
        <div class="bildiri" id="bildiri"></div>
    </div>

    <script src="script.js"></script>
</body>

</html>
